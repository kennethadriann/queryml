[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryml"
version = "0.1.0"
description = "Agentic analytics framework — YAML semantic models + AI investigation"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=1.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "duckdb>=0.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
include = ["queryml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
